.metric .label{font-size:12px;color:var(--muted)}.metric .num{font-size:29px;font-weight:800;margin-top:6px}.delta{font-size:11px;color:var(--green);margin-top:7px}.iconbox{width:40px;height:40px;border-radius:12px;background:#f0ebff;color:var(--p);display:grid;place-items:center}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h3{margin:0;font-size:15px}.muted{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.table th{background:#fafaff;color:#657086;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:750}.critical{background:#ffe5e8;color:#b52231}.high{background:#fff0dc;color:#b66a00}.medium{background:#e8f2ff;color:#1d66a4}.low{background:#e8f8f0;color:#18724b}.leadership{background:#efe7ff;color:#6237c7}.open{background:#eef0ff;color:#5541bc}.closed{background:#e8f8f0;color:#18724b}.overdue{background:#ffe5e8;color:#b52231}.progress{height:7px;background:#eceef5;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--p);border-radius:99px}.chart{height:190px;display:flex;align-items:end;gap:10px;padding:20px 8px 4px}.bar{flex:1;background:linear-gradient(180deg,#a78bf8,#6c43e8);border-radius:8px 8px 3px 3px;position:relative;min-width:12px}.bar small{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);color:var(--muted)}.list{display:flex;flex-direction:column;gap:11px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-main{min-width:0}.item-main strong{font-size:12px}.item-main div{font-size:11px;color:var(--muted);margin-top:3px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.green{background:var(--green)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{font-size:11px;color:#657086;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;outline:none}.field textarea{min-height:92px;resize:vertical}.span2{grid-column:1/-1}.switch{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px;border-radius:10px}.toggle{width:42px;height:24px;border-radius:20px;background:#d8dce7;position:relative}.toggle.on{background:var(--p)}.toggle i{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s}.toggle.on i{left:21px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px}.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-size:12px}.tabs button.active{color:var(--p);border-bottom:2px solid var(--p);font-weight:750}.profile{display:grid;grid-template-columns:280px 1fr;gap:16px}.profile-side{background:linear-gradient(180deg,#f0ebff,#fff);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}.person{width:76px;height:76px;border-radius:50%;background:#ded2ff;color:#5c39c8;display:grid;place-items:center;font-size:27px;font-weight:800;margin:0 auto 10px}.timeline{border-left:2px solid #e9e5f8;margin-left:10px;padding-left:20px}.event{position:relative;padding:0 0 18px}.event:before{content:'';position:absolute;left:-27px;top:3px;width:10px;height:10px;border- .menu-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  height:40px;
  padding:0 12px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);

.menu-btn:hover{background:#f7f5ff;border-color:#ddd5f8}
.menu-icon{display:inline-flex;flex-direction:column;gap:3px;width:16px}

.menu-btn.open{background:#f1edff;color:var(--p);border-color:#ded4ff}

.signin-btn{
  height:40px;
  padding:0 15px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:10px;
  font-size:12px;
  font-weight:750;
}
.signin-btn:hover{background:#f7f5ff;border-color:#ddd5f8}

.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.page-title{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Desktop sidebar collapse */
body.sidebar-collapsed .sidebar{width:78px}
body.sidebar-collapsed .main{margin-left:78px;width:calc(100% - 78px)}
body.sidebar-collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
body.sidebar-collapsed .brand img{width:48px}
body.sidebar-collapsed .brand small,
body.sidebar-collapsed .group,
body.sidebar-collapsed .nav button span:not(.ico),

.mobile-overlay{display:none}

@media(max-width:1050px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2,.profile{grid-template-columns:1fr}
  .sidebar{width:78px}
  .sidebar .brand small,.sidebar .group,.sidebar .nav span:not(.ico),.sidebar .profile{display:none}
  .brand{justify-content:center;padding-left:0;padding-right:0}
  .brand img{width:48px}
  .main{margin-left:78px;width:calc(100% - 78px)}
}

@media(max-width:700px){

  .sidebar{
    width:260px;
    padding:20px 14px;
    top:0;bottom:0;left:0;right:auto;
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);

  .span2{grid-column:auto}
  body.mobile-menu-open{overflow:hidden}
  .mobile-overlay.show{
    display:block;
    position:fixed;
    inset:0;
    background:rgba(17,20,35,.42);
    backdrop-filter:blur(2px);
    z-index:35;
  }
}

<script>
const navGroups=[['WORKSPACE',[['dashboard','⌂','Dashboard'],['tasks','✓','My Tasks'],['registry','♙','Beneficiary Registry'],['beneficiary','◎','Beneficiary 360'],['cases','!','Cases & Escalation'],['alerts','◉','Alerts Center'],['referrals','↗','Referrals'],['calls','☎','AI Voice / Calls']]],['INSIGHTS',[['analytics','◒','Analytics'],['reports','▤','Reports & Exports']]],['ADMINISTRATION',[['users','♟','Users & Roles'],['routing','⇄','Routing Matrix'],['taxonomy','◈','Risk Taxonomy'],['calling','◷','Calling Rules'],['notifications','✉','Notifications'],['integrations','⌘','Integrations'],['audit','▥','Audit Trail'],['security','▣','Security & Compliance']]],['SUPPORT',[['help','?','Help & Training'],['mobile','▣','Mobile Experience']]]];
const pages={};
function el(s){const d=document.createElement('div');d.innerHTML=s.trim();return d.firstChild}
function navBuild(){const n=document.getElementById('nav');n.innerHTML='';navGroups.forEach(g=>{n.innerHTML+=`<div class="group">${g[0]}</div>`;g[1].forEach(x=>n.innerHTML+=`<button data-page="${x[0]}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`)});}

page('dashboard','District Operations Dashboard','Live operational view across risk, cases, referrals and outreach.',`<div class="cards">${[['Critical cases','12','Immediate attention','!'],['High-risk active','38','8 overdue','⚠'],['Open referrals','17','5 awaiting outcome','↗'],['Today contactability','91%','+4.2% vs yesterday','☎']].map(x=>`<div class="card metric"><div><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="delta">${x[2]}</div></div><div class="iconbox">${x[3]}</div></div>`).join('')}</div><div class="grid2"><div class="card"><div class="section-title"><h3>Risk & case trend</h3><span class="muted">Last 7 days</span></div><div class="chart">${[42,55,48,70,62,88,76].map((h,i)=>`<div class="bar" style="height:${h}%"><small>${['M','T','W','T','F','S','S'][i]}</small></div>`).join('')}</div></div><div class="card"><div class="section-title"><h3>Response SLA</h3><span class="muted">Today</span></div><div class="list">${[['Critical response','94%','green'],['2h acknowledgement','87%','amber'],['Referral closure','79%','amber'],['Contactability','91%','green']].map(x=>`<div class="item"><div class="item-main"><strong>${x[0]}</strong><div>${x[1]} within target</div></div><span class="dot ${x[2]}"></span></div>`).join('')}</div></div></div><div class="grid2" style="margin-top:16px"><div class="card"><div class="section-title"><h3>Priority queue</h3><button class="btn" onclick="go('cases')">View all</button></div>${table(['Case','Beneficiary','Risk','Issue','Owner','SLA'],cases.slice(0,3).map(r=>[r[0],r[1],badge(r[2]),r[3],r[4],badge(r[5]==='—'?'Resolved':'Open')]))}</div><div class="card"><div class="section-title"><h3>Referral readiness</h3><span class="muted">Current</span></div><div class="list">${[['District Hospital Shahdol','3 emergency beds','92%'],['Jaisinghnagar CHC','1 obstetric slot','68%'],['Beohari CHC','2 beds / ambulance','81%']].map(x=>`<div class="item"><div class="item-main"><strong>${x[0]}</strong><div>${x[1]}</div></div><strong>${x[2]}</strong></div>`).join('')}</div></div></div>`,'<button class="btn primary" onclick="openCase()">+ Create Case</button>');
page('tasks','My Tasks','Work assigned to you, sorted by urgency.',`<div class="cards">${[['Due now','6','Critical / overdue'],['Due today','14','Across 4 queues'],['In progress','9','Active follow-ups'],['Completed','32','This week']].map(x=>`<div class="card metric"><div><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="delta">${x[2]}</div></div></div>`).join('')}</div>${table(['Priority','Task','Beneficiary','Due','Status','Action'],[['Critical','Emergency readiness call','Sita Bai','10:20 AM',badge('Open'),`<button class="btn" onclick="notify('Task opened')">Open</button>`],['High','Confirm referral receipt','Kavita Bai','11:05 AM',badge('Open'),`<button class="btn" onclick="notify('Referral task opened')">Open</button>`],['Medium','Follow-up after missed milestone','Rekha Bai','Today',badge('In Progress'),`<button class="btn" onclick="notify('Task opened')">Open</button>`]])}`);
page('registry','Beneficiary Registry','Master registry of tracked high-risk beneficiaries.',`<div class="card"><div class="tabs"><button class="active">All beneficiaries</button><button>High risk</button><button>Post-natal</button><button>Needs follow-up</button></div><div style="display:flex;gap:8px;margin-bottom:12px"><input id="benSearch" class="search" style="width:320px" placeholder="Search name, ID, village" oninput="filterBen()"><select class="field" style="width:160px;padding:9px;border:1px solid var(--line);border-radius:9px"><option>All risk levels</option><option>Critical</option><option>High</option></select><button class="btn primary" onclick="openBeneficiary()">+ Add beneficiary</button><button class="btn" onclick="notify('CSV export prepared')">Export CSV</button></div><div id="benTable">${table(['ID','Beneficiary','Age','Block','Risk','Next action','Facility'],beneficiaries.map(r=>[r[0],`<button class="btn" style="padding:3px 0;border:0;background:none;color:var(--p)" onclick="openBeneficiary('${r[0]}')">${r[1]}</button>`,r[2],r[3],badge(r[4]),r[5],r[6]]))}</div></div>`);

/* =========================================
   SIDEBAR MENU
========================================= */
function setMenuButton(open, mobile=false){
  const btn=document.getElementById('menuBtn');
  if(!btn) return;
  btn.classList.toggle('open',open);
  btn.setAttribute('aria-expanded',open?'true':'false');
  btn.setAttribute('aria-label',open?'Close menu':'Open menu');
  btn.querySelector('span:last-child').textContent='Menu';
}

function toggleSidebar(){
  const sidebar=document.querySelector('.sidebar');
  const overlay=document.getElementById('mobileOverlay');
  const mobile=window.innerWidth<=700;

  if(mobile){
    const open=!sidebar.classList.contains('mobile-open');
    sidebar.classList.toggle('mobile-open',open);
    overlay.classList.toggle('show',open);
    document.body.classList.toggle('mobile-menu-open',open);
    setMenuButton(open,true);
    return;
  }

  document.body.classList.toggle('sidebar-collapsed');
  const open=!document.body.classList.contains('sidebar-collapsed');
  setMenuButton(open,false);
}

function closeSidebar(){
  const sidebar=document.querySelector('.sidebar');
  const overlay=document.getElementById('mobileOverlay');
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('show');
  document.body.classList.remove('mobile-menu-open');
  setMenuButton(false,true);
}

function closeMobileMenu(){closeSidebar()}
function toggleMobileMenu(){toggleSidebar()}

window.addEventListener('resize',()=>{
  if(window.innerWidth>700){
    document.querySelector('.sidebar')?.classList.remove('mobile-open');
    document.getElementById('mobileOverlay')?.classList.remove('show');
    document.body.classList.remove('mobile-menu-open');
    const collapsed=document.body.classList.contains('sidebar-collapsed');
    setMenuButton(!collapsed,false);
  }
});

function go(id){

  document
    .querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

  const targetPage = document.getElementById('p-' + id);

  if(targetPage){
    targetPage.classList.add('active');
  }

  document
    .querySelectorAll('.nav button')
    .forEach(b => {
      b.classList.toggle(
        'active',
        b.dataset.page === id
      );
    });

  const t = document.querySelector(
    `[data-page="${id}"] span:last-child`
  );

  document.getElementById('pageTitle').textContent =
    t ? t.textContent : 'MNSI Phase I';

  history.replaceState(
    {},
    '',
    `#${id}`
  );

  /*
    Mobile par menu item click karte hi
    sidebar automatically close ho jayega.
  */
  if(window.innerWidth <= 700){
    closeMobileMenu();
  }

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}
