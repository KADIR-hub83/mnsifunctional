<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYI.AI · MNSI Phase I · Full Functional Prototype</title>
<style>
:root{--p:#6b45e8;--pd:#5230c8;--pl:#eee9ff;--teal:#2a9d8f;--blue:#247ba0;--navy:#26334d;--bg:#f6f7fb;--card:#fff;--text:#26334d;--muted:#718096;--line:#e1e5ee;--danger:#c62828;--warn:#c97900;--success:#16805a;--info:#2563eb;--shadow:0 8px 26px rgba(55,45,110,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f8f7ff,#f3f9fa);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:250px;position:fixed;left:0;top:0;bottom:0;background:linear-gradient(180deg,#5130c8,#6b45e8);color:#fff;padding:18px 13px;z-index:20}
.logo{padding:8px 8px 16px;border-bottom:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;text-align:center}.logo img{width:165px;height:84px;max-width:100%;object-fit:contain;display:block;background:transparent}.logo b{display:none}.logo small{display:block;margin-top:6px;color:#efeaff;font-size:10px;line-height:1.4}
.nav{padding-top:12px;height:calc(100vh - 170px);overflow:auto}.nav-group{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:#ddd4ff;margin:14px 10px 5px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#f5f2ff;padding:10px 11px;border-radius:8px;margin:2px 0;font-size:12px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.16)}.profile{position:absolute;bottom:12px;left:15px;right:15px;border-top:1px solid rgba(255,255,255,.18);padding:11px 5px;font-size:10px;color:#e8e2ff}
.main{margin-left:250px;flex:1;min-width:0}.top-brand{width:74px;height:42px;border-radius:7px;background:linear-gradient(135deg,#5130c8,#6b45e8);display:flex;align-items:center;justify-content:center;padding:3px;overflow:hidden}.top-brand img{width:70px;height:36px;object-fit:contain}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 25px;position:sticky;top:0;z-index:10}.top:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--p),var(--teal),var(--blue))}.page-title{font-weight:800;font-size:14px;min-width:220px}.search{display:flex;align-items:center;gap:8px;background:#f8f9fc;border:1px solid var(--line);border-radius:8px;padding:7px 10px;flex:1;max-width:470px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:12px}.top-actions{margin-left:auto;display:flex;gap:7px}
.content{padding:24px 28px}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.head h1{font-size:23px;margin:0}.head p{font-size:12px;color:var(--muted);margin:5px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:7px;padding:8px 11px;font-size:11px}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.btn.success{background:var(--success);border-color:var(--success);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.grid{display:grid;gap:15px}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:16px}.kpi .label{font-size:11px;color:var(--muted)}.kpi .value{font-size:27px;font-weight:800;margin-top:7px}.kpi .sub{font-size:10px;color:var(--success);margin-top:4px}.section{font-size:13px;font-weight:800;margin:0 0 12px}
.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700}.critical{background:#fff0f0;color:var(--danger)}.high{background:#fff6e7;color:var(--warn)}.medium{background:#edf4ff;color:var(--info)}.low{background:#eef1f5;color:#586579}.ok{background:#ebf8f2;color:var(--success)}
table{width:100%;border-collapse:collapse;font-size:11px}th{background:#f8f9fc;color:var(--muted);font-weight:700}th,td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}tr:hover td{background:#fbfcfe}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px 10px;font-size:11px}
.notice{display:flex;gap:9px;align-items:center;background:#effaf7;border:1px solid #c9eee5;color:#245a51;border-radius:9px;padding:10px 12px;font-size:11px;margin-bottom:15px}.notice strong{color:var(--teal)}
.alert{border-left:4px solid var(--danger);background:#fff8f8;border:1px solid #f2d0d0;border-left-width:4px;padding:11px;border-radius:8px;margin-bottom:8px}.alert b{font-size:11px}.alert p{font-size:10px;color:var(--muted);margin:4px 0}
.kv{display:grid;grid-template-columns:145px 1fr;gap:9px;font-size:11px}.kv b{color:var(--muted)}
.timeline{border-left:2px solid #e2e6ee;padding-left:17px;margin-left:7px}.event{position:relative;margin:0 0 17px}.event:before{content:"";position:absolute;width:8px;height:8px;background:var(--p);border-radius:50%;left:-22px;top:3px}.event b{font-size:11px}.event small{display:block;color:var(--muted);margin-top:3px}
.bar{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--teal))}
.form{display:grid;gap:11px}.form label{font-size:10px;color:var(--muted);display:grid;gap:5px}.form textarea{min-height:80px;resize:vertical}
.modalbg{display:none;position:fixed;inset:0;background:rgba(30,25,60,.42);z-index:50;align-items:center;justify-content:center}.modalbg.show{display:flex}.modal{background:#fff;border-radius:12px;width:min(700px,92vw);max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal h2{font-size:18px;margin:0}.x{border:0;background:#f4f5f8;border-radius:7px;padding:6px 9px}
.toast{position:fixed;right:22px;bottom:22px;background:#26334d;color:#fff;padding:11px 14px;border-radius:8px;font-size:11px;display:none;z-index:80}.toast.show{display:block}
.mobile{max-width:390px;margin:auto;border:8px solid #24304a;border-radius:24px;overflow:hidden;background:#fff}.mhead{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;padding:15px}.mcontent{padding:14px}.mnav{display:flex;justify-content:space-around;padding:10px;border-top:1px solid var(--line);font-size:10px}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.side{display:none}.top-brand{display:none}.main{margin-left:0}.g6,.g4,.g3,.g2{grid-template-columns:1fr}.content{padding:16px}.search{display:none}.page-title{min-width:0}.top{padding:0 15px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="logo"><img id="brandLogo" alt="HYI.AI logo"><small>MNSI Phase I<br>Maternal & Newborn Health Digital Care Platform</small></div>
 <nav class="nav">
  <div class="nav-group">Workspace</div>
  <button data-p="dashboard">▦ Dashboard</button><button data-p="tasks">✓ My Tasks</button><button data-p="beneficiaries">◉ Beneficiary Registry</button><button data-p="beneficiary360">◎ Beneficiary 360</button><button data-p="cases">⚠ Cases & Escalation</button><button data-p="alerts">! Alerts Center</button><button data-p="referrals">⇢ Referrals</button><button data-p="calls">☎ AI Voice / Calls</button>
  <div class="nav-group">Insights</div><button data-p="analytics">◫ Analytics</button><button data-p="reports">▤ Reports & Exports</button>
  <div class="nav-group">Administration</div><button data-p="users">♙ Users & Roles</button><button data-p="routing">⇄ Routing Matrix</button><button data-p="risk">◆ Risk Taxonomy</button><button data-p="calling">◷ Calling Rules</button><button data-p="notifications">✉ Notifications</button><button data-p="integrations">⌘ Integrations</button><button data-p="audit">▥ Audit Trail</button><button data-p="security">◈ Security & Compliance</button>
  <div class="nav-group">Support</div><button data-p="help">? Help & Training</button><button data-p="mobile">▣ Mobile Experience</button>
 </nav>
 <div class="profile">Signed in as <b>District Operator</b><br>Shahdol · Madhya Pradesh</div>
</aside>
<main class="main">
<header class="top"><div class="top-brand"><img id="topBrandLogo" alt="HYI.AI logo"></div><div class="page-title" id="topTitle">MNSI Dashboard</div><div class="search">⌕ <input id="globalSearch" placeholder="Search beneficiary, case, referral…" onkeydown="if(event.key==='Enter')quickSearch()"></div><div class="top-actions"><button class="btn" onclick="page('alerts')">🔔 3</button><button class="btn" onclick="modal('profile')">Operator ▾</button></div></header>
<section class="content" id="content"></section>
</main></div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const STORE="mnsi_full_proto_v1";
const state=JSON.parse(localStorage.getItem(STORE)||'{"beneficiaries":[],"cases":[],"referrals":[],"users":[],"notes":[],"audit":[]}');
const seedB=[{id:"BEN-10482",name:"Sita Bai",age:24,loc:"Block A",phc:"PHC Shahdol",risk:"Critical",stage:"Antenatal",phone:"98XXXX1204",last:"2 min ago",case:"CAS-70041"},{id:"BEN-10371",name:"Kavita Bai",age:29,loc:"Block B",phc:"PHC Burhar",risk:"High",stage:"Antenatal",phone:"97XXXX4421",last:"28 min ago",case:"CAS-70038"},{id:"BEN-10290",name:"Rekha Bai",age:22,loc:"Block C",phc:"PHC Sohagpur",risk:"Medium",stage:"Post-natal",phone:"99XXXX8112",last:"2 hrs ago",case:"CAS-70031"},{id:"BEN-10115",name:"Sunita Bai",age:31,loc:"Block A",phc:"PHC Shahdol",risk:"Low",stage:"Antenatal",phone:"96XXXX3009",last:"Yesterday",case:"—"}];
const seedC=[{id:"CAS-70041",benef:"Sita Bai",risk:"Critical",trigger:"Severe warning signal detected",owner:"Medical Officer",sla:"03:42",status:"Open"},{id:"CAS-70038",benef:"Kavita Bai",risk:"High",trigger:"Missed clinical milestone",owner:"Block Coordinator",sla:"1:14:22",status:"Acknowledged"},{id:"CAS-70031",benef:"Rekha Bai",risk:"Medium",trigger:"Service-delivery complaint",owner:"Field Worker",sla:"3:05:18",status:"In Progress"}];
if(!state.beneficiaries.length)state.beneficiaries=seedB;
if(!state.cases.length)state.cases=seedC;
if(!state.referrals.length)state.referrals=[{id:"REF-4401",benef:"Sita Bai",risk:"Critical",destination:"District Hospital",status:"En Route",notified:"10:45"},{id:"REF-4398",benef:"Kavita Bai",risk:"High",destination:"PHC Burhar",status:"Awaiting Outcome",notified:"09:30"}];
if(!state.users.length)state.users=[{name:"Anita Sharma",role:"District Admin",area:"Shahdol",status:"Active"},{name:"Rakesh Singh",role:"Medical Officer",area:"PHC Shahdol",status:"Active"}];
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function audit(event,ref=""){state.audit.unshift({time:new Date().toLocaleString(),actor:"District Operator",event,ref});state.audit=state.audit.slice(0,100);save()}
function badge(x){return `<span class="badge ${String(x).toLowerCase()}">${x}</span>`}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function layout(t,s,b,a=""){document.getElementById("topTitle").textContent=t;document.getElementById("content").innerHTML=`<div class="head"><div><h1>${t}</h1><p>${s}</p></div><div class="actions">${a}</div></div>${b}`}
function page(p){document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===p));if(P[p])P[p]()}
function modal(type,d={}){let m=document.getElementById("modal"),h="";
if(type==="profile")h=`<div class="modalhead"><h2>My Profile</h2><button class="x" onclick="closeModal()">✕</button></div><div class="kv"><b>User</b><span>District Operator</span><b>Role</b><span>Operator / Stakeholder</span><b>District</b><span>Shahdol</span><b>Session</b><span>Active</span></div>`;
if(type==="case")h=`<div class="modalhead"><h2>Create Case</h2><button class="x" onclick="closeModal()">✕</button></div><form class="form" onsubmit="createCase(event)"><label>Beneficiary<select id="caseBen">${state.beneficiaries.map(b=>`<option value="${b.id}">${b.name} · ${b.id}</option>`).join("")}</select></label><label>Risk<select id="caseRisk"><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label><label>Trigger / reason<textarea id="caseTrigger" required placeholder="Describe detected signal"></textarea></label><label>Assign to<select id="caseOwner"><option>Medical Officer</option><option>Block Coordinator</option><option>Field Worker</option></select></label><button class="btn primary">Create & Route</button></form>`;
if(type==="user")h=`<div class="modalhead"><h2>Add User</h2><button class="x" onclick="closeModal()">✕</button></div><form class="form" onsubmit="createUser(event)"><label>Full name<input id="uName" required></label><label>Role<select id="uRole"><option>Operator</option><option>Clinician</option><option>District Admin</option><option>Field Worker</option></select></label><label>Area<input id="uArea" required></label><button class="btn primary">Create User</button></form>`;
if(type==="benef")h=`<div class="modalhead"><h2>Beneficiary 360</h2><button class="x" onclick="closeModal()">✕</button></div>${b360(d)}`;
if(type==="ref")h=`<div class="modalhead"><h2>Referral Detail</h2><button class="x" onclick="closeModal()">✕</button></div><div class="kv"><b>Referral</b><span>${d.id}</span><b>Beneficiary</b><span>${d.benef}</span><b>Risk</b><span>${badge(d.risk)}</span><b>Destination</b><span>${d.destination}</span><b>Status</b><span>${d.status}</span></div><br><div class="actions"><button class="btn primary" onclick="updateReferral('${d.id}','Acknowledged')">Acknowledge</button><button class="btn success" onclick="updateReferral('${d.id}','Closed')">Record Outcome / Close</button></div>`;
m.innerHTML=h;document.getElementById("modalbg").classList.add("show")}
function closeModal(){document.getElementById("modalbg").classList.remove("show")}
function b360(b){return `<div class="card" style="box-shadow:none"><div style="display:flex;justify-content:space-between"><div><b style="font-size:17px">${b.name}</b><div style="font-size:10px;color:var(--muted)">${b.id} · ${b.age} yrs · ${b.loc}</div></div>${badge(b.risk)}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="kv"><b>Phone</b><span>${b.phone}</span><b>Stage</b><span>${b.stage}</span><b>PHC</b><span>${b.phc}</span><b>Last contact</b><span>${b.last}</span><b>Open case</b><span>${b.case}</span></div><br><div class="actions"><button class="btn primary" onclick="closeModal();page('calls')">☎ Call</button><button class="btn danger" onclick="closeModal();modal('case')">Create Case</button><button class="btn" onclick="closeModal();page('referrals')">Referral</button></div></div>`}
function createCase(e){e.preventDefault();let b=state.beneficiaries.find(x=>x.id===caseBen.value);let id="CAS-"+(70050+state.cases.length);state.cases.unshift({id,benef:b.name,risk:caseRisk.value,trigger:caseTrigger.value,owner:caseOwner.value,sla:caseRisk.value==="Critical"?"05:00":"2 hr",status:"Open"});b.case=id;audit("Case created",id);closeModal();toast("Case "+id+" created and routed");page("cases")}
function createUser(e){e.preventDefault();state.users.push({name:uName.value,role:uRole.value,area:uArea.value,status:"Active"});audit("User created",uName.value);closeModal();toast("User created");page("users")}
function updateReferral(id,status){let r=state.referrals.find(x=>x.id===id);if(r){r.status=status;audit("Referral status updated",id);save();closeModal();toast("Referral updated");page("referrals")}}
function caseAction(i,status){state.cases[i].status=status;audit("Case "+status.toLowerCase(),state.cases[i].id);save();toast("Case "+status);page("cases")}
function bSearch(){let q=(document.getElementById("bq")?.value||"").toLowerCase(),r=document.getElementById("br")?.value||"";let a=state.beneficiaries.filter(b=>(!q||JSON.stringify(b).toLowerCase().includes(q))&&(!r||b.risk===r));document.getElementById("brows").innerHTML=a.map(b=>`<tr><td>${b.id}</td><td><b>${b.name}</b><br><small>${b.age} yrs · ${b.loc}</small></td><td>${b.stage}</td><td>${badge(b.risk)}</td><td>${b.phc}</td><td>${b.last}</td><td>${b.case}</td><td><button class="btn" onclick='modal("benef",${JSON.stringify(b).replace(/"/g,"&quot;")})'>View</button></td></tr>`).join("")||`<tr><td colspan="8">No beneficiaries found.</td></tr>`}
function quickSearch(){let q=document.getElementById("globalSearch").value.trim();if(!q){toast("Enter a search term");return}page("beneficiaries");setTimeout(()=>{bq.value=q;bSearch()},30)}
function exportData(type){let rows=type==="beneficiaries"?state.beneficiaries:state.cases;let csv=Object.keys(rows[0]).join(",")+"\n"+rows.map(x=>Object.values(x).map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=type+".csv";a.click();audit("CSV exported",type);toast("CSV exported")}
const P={
dashboard(){layout("District Operations Dashboard","Maternal & Newborn Safety Initiative · Shahdol",`<div class="notice">♥ <span><strong>Good morning.</strong> Start with urgent work first. Patient-facing actions should be confirmed before escalation.</span></div><div class="grid g6">${[["Tracked Beneficiaries",state.beneficiaries.length,"Active registry"],["Critical",state.beneficiaries.filter(x=>x.risk==="Critical").length+14,"Immediate attention"],["High",76,"12 new today"],["Open Cases",state.cases.length+140,"31 due today"],["Overdue",11,"Escalate now"],["Referrals",state.referrals.length+25,"8 awaiting outcome"]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join("")}</div><div class="grid g2" style="margin-top:15px"><div class="card"><h3 class="section">Priority Queue</h3>${state.cases.slice(0,3).map((c,i)=>`<div class="alert"><b>${c.benef} · ${c.id}</b> ${badge(c.risk)}<p>${c.trigger} · Owner: ${c.owner} · SLA: <b>${c.sla}</b></p><button class="btn danger" onclick="page('cases')">Open Case</button></div>`).join("")}</div><div class="card"><h3 class="section">Service Performance</h3><p style="font-size:10px;color:var(--muted)">Contactability · 90%</p><div class="bar"><i style="width:90%"></i></div><p style="font-size:10px;color:var(--muted)">Acknowledgement · 84%</p><div class="bar"><i style="width:84%"></i></div><p style="font-size:10px;color:var(--muted)">Referral closure · 71%</p><div class="bar"><i style="width:71%"></i></div></div></div><div class="card" style="margin-top:15px"><h3 class="section">Quick Actions</h3><div class="actions"><button class="btn primary" onclick="modal('case')">+ Create Case</button><button class="btn" onclick="page('beneficiaries')">Find Beneficiary</button><button class="btn" onclick="page('referrals')">View Referrals</button></div></div>`)},
tasks(){layout("My Tasks","Your prioritized work for today.",`<div class="card"><table><thead><tr><th>Priority</th><th>Task</th><th>Reference</th><th>Due</th><th></th></tr></thead><tbody>${state.cases.slice(0,6).map((c,i)=>`<tr><td>${badge(c.risk)}</td><td>${c.trigger}</td><td>${c.benef} · ${c.id}</td><td>${c.sla}</td><td><button class="btn small" onclick="page('cases')">Open</button></td></tr>`).join("")}</tbody></table></div>`)},
beneficiaries(){layout("Beneficiary Registry","Search, filter and act on tracked beneficiaries.",`<div class="filters"><input id="bq" placeholder="Name, ID, mobile or location" oninput="bSearch()"><select id="br" onchange="bSearch()"><option value="">All Risk</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select><button class="btn" onclick="exportData('beneficiaries')">Export CSV</button></div><div class="card"><table><thead><tr><th>ID</th><th>Beneficiary</th><th>Stage</th><th>Risk</th><th>PHC</th><th>Last Contact</th><th>Case</th><th></th></tr></thead><tbody id="brows"></tbody></table></div>`);bSearch()},
beneficiary360(){let b=state.beneficiaries[0];layout("Beneficiary 360",`${b.id} · Longitudinal record`,`${b360(b)}<div class="grid g3" style="margin-top:15px"><div class="card"><h3 class="section">Risk & Clinical Summary</h3><div class="kv"><b>Current risk</b><span>${badge(b.risk)}</span><b>Stage</b><span>${b.stage}</span><b>Risk reason</b><span>Urgent warning signal</span><b>Last assessment</b><span>Today, 10:42</span></div></div><div class="card"><h3 class="section">Care Milestones</h3><div class="timeline"><div class="event"><b>ANC visit</b><small>Completed</small></div><div class="event"><b>Clinical review</b><small>Due today</small></div><div class="event"><b>Follow-up</b><small>Pending</small></div></div></div><div class="card"><h3 class="section">Interaction Timeline</h3><div class="timeline"><div class="event"><b>AI Voice Call</b><small>Signal detected</small></div><div class="event"><b>Case</b><small>${b.case}</small></div></div></div></div>`)},
cases(){layout("Cases & Escalation","Manage ownership, response clocks and escalation.",`<div class="filters"><input placeholder="Search case"><select><option>All Risk</option><option>Critical</option><option>High</option></select><button class="btn primary" onclick="modal('case')">+ Create Case</button><button class="btn" onclick="exportData('cases')">Export CSV</button></div><div class="card"><table><thead><tr><th>Case</th><th>Beneficiary</th><th>Risk</th><th>Trigger</th><th>Owner</th><th>SLA</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.cases.map((c,i)=>`<tr><td><b>${c.id}</b></td><td>${c.benef}</td><td>${badge(c.risk)}</td><td>${c.trigger}</td><td>${c.owner}</td><td><b>${c.sla}</b></td><td>${c.status}</td><td><button class="btn small" onclick="caseAction(${i},'Acknowledged')">Ack</button> <button class="btn small danger" onclick="caseAction(${i},'Escalated')">Escalate</button> <button class="btn small success" onclick="caseAction(${i},'Resolved')">Resolve</button></td></tr>`).join("")}</tbody></table></div>`)},
alerts(){layout("Alerts Center","Urgent signals requiring acknowledgement and routing.",`<div class="grid g3"><div class="card kpi"><div class="label">Critical</div><div class="value">6</div></div><div class="card kpi"><div class="label">Unacknowledged</div><div class="value">9</div></div><div class="card kpi"><div class="label">Overdue</div><div class="value">3</div></div></div><div class="card" style="margin-top:15px"><table><thead><tr><th>Severity</th><th>Alert</th><th>Source</th><th>Owner</th><th></th></tr></thead><tbody>${state.cases.map(c=>`<tr><td>${badge(c.risk)}</td><td>${c.trigger} · ${c.benef}</td><td>AI / Workflow</td><td>${c.owner}</td><td><button class="btn small" onclick="caseAction(0,'Acknowledged')">Acknowledge</button></td></tr>`).join("")}</tbody></table></div>`)},
referrals(){layout("Referrals","Track notification, readiness and confirmed outcomes.",`<div class="notice">♥ <span><strong>Referral journey:</strong> Notify → Acknowledge → En route → Service received → Close.</span></div><div class="grid g4">${[["Open",state.referrals.length],["Critical",state.referrals.filter(x=>x.risk==="Critical").length],["Awaiting Outcome",state.referrals.filter(x=>x.status==="Awaiting Outcome").length],["Closed",state.referrals.filter(x=>x.status==="Closed").length]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("")}</div><div class="card" style="margin-top:15px"><table><thead><tr><th>Referral</th><th>Beneficiary</th><th>Risk</th><th>Destination</th><th>Status</th><th></th></tr></thead><tbody>${state.referrals.map(r=>`<tr><td>${r.id}</td><td>${r.benef}</td><td>${badge(r.risk)}</td><td>${r.destination}</td><td>${r.status}</td><td><button class="btn small" onclick='modal("ref",${JSON.stringify(r).replace(/"/g,"&quot;")})'>Open</button></td></tr>`).join("")}</tbody></table></div>`)},
calls(){layout("AI Voice / Calls","Identify → listen → detect → confirm → route.",`<div class="grid g2"><div class="card"><h3 class="section">Current Call</h3><h2 style="font-size:18px">Sita Bai · BEN-10482</h2><p style="font-size:10px;color:var(--muted)">Connected · Hindi · Attempt #2</p><div class="card" style="box-shadow:none"><b>Approved script</b><p style="font-size:11px">Namaste. This is the MNSI health support service. Are you experiencing any urgent concern?</p></div><div class="actions"><button class="btn danger" onclick="modal('case')">Escalate / Create Case</button><button class="btn" onclick="toast('Retry scheduled')">Retry</button><button class="btn success" onclick="toast('Call completed')">Complete</button></div></div><div class="card"><h3 class="section">Interaction Signals</h3><div class="timeline"><div class="event"><b>Connected</b><small>Hindi detected</small></div><div class="event"><b>Signal detected</b><small>Potential urgent warning</small></div><div class="event"><b>Routing</b><small>Case ready for medical officer</small></div></div></div></div>`)},
analytics(){layout("Analytics","Operational performance and risk trends.",`<div class="grid g4">${[["Contactability","90%"],["Critical response","92%"],["Acknowledgement","84%"],["Referral closure","71%"]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="bar"><i style="width:${x[1]}"></i></div></div>`).join("")}</div><div class="grid g2" style="margin-top:15px"><div class="card"><h3 class="section">7-Day Trend</h3><div style="height:160px;display:flex;align-items:end;gap:8px">${[42,58,50,75,61,86,70].map((v,i)=>`<div style="flex:1;text-align:center;font-size:9px;color:var(--muted)"><div style="height:${v}px;background:linear-gradient(var(--p),#a993f3);border-radius:5px 5px 0 0"></div>${["M","T","W","T","F","S","S"][i]}</div>`).join("")}</div></div><div class="card"><h3 class="section">District / Block View</h3><div class="kv"><b>Block A</b><span>42 critical/high</span><b>Block B</b><span>31</span><b>Block C</b><span>21</span></div></div></div>`)},
reports(){layout("Reports & Exports","Generate controlled operational extracts.",`<div class="grid g3">${["Daily Risk Report","Referral Performance","AI Call Report","Case Accountability","Audit Export","Beneficiary Registry"].map(x=>`<div class="card"><h3 class="section">${x}</h3><p style="font-size:10px;color:var(--muted)">Generate current data for authorized operational use.</p><button class="btn primary" onclick="toast('${x} generated')">Generate</button></div>`).join("")}</div>`)},
users(){layout("Users & Roles","Manage authorized platform users.",`<div class="actions" style="margin-bottom:14px"><button class="btn primary" onclick="modal('user')">+ Add User</button></div><div class="card"><table><thead><tr><th>User</th><th>Role</th><th>Area</th><th>Status</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${u.name}</td><td>${u.role}</td><td>${u.area}</td><td>${badge("OK")} ${u.status}</td></tr>`).join("")}</tbody></table></div>`)},
routing(){layout("Routing Matrix","Configure risk-to-role and escalation rules.",`<div class="card"><table><thead><tr><th>Risk</th><th>Primary Role</th><th>Channel</th><th>SLA</th><th>Escalation</th><th></th></tr></thead><tbody>${[["Critical","Medical Officer","Voice + WhatsApp","5 min","District Leadership"],["High","Block Coordinator","Voice + WhatsApp","2 hr","District Admin"],["Medium","Field Worker","Voice / SMS","1 day","Block Coordinator"],["Low","Field Worker","Scheduled call","Routine","Supervisor"]].map(r=>`<tr><td>${badge(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><button class="btn small" onclick="toast('Routing rule saved')">Edit</button></td></tr>`).join("")}</tbody></table></div>`)},
risk(){layout("Risk Taxonomy","Manage approved risk tiers and response expectations.",`<div class="grid g2">${[["Critical","Immediate danger / urgent warning signal","5 min"],["High","Significant risk / timely intervention","2 hr"],["Medium","Follow-up or service concern","1 day"],["Low","Routine monitoring","Routine"]].map(x=>`<div class="card"><h3 class="section">${x[0]} ${badge(x[0])}</h3><p style="font-size:11px">${x[1]}</p><div class="kv"><b>Target</b><span>${x[2]}</span></div><br><button class="btn" onclick="toast('Risk configuration opened')">Configure</button></div>`).join("")}</div>`)},
calling(){layout("Calling Rules","Configure safe outreach and retry controls.",`<div class="grid g2"><div class="card"><form class="form" onsubmit="event.preventDefault();audit('Calling rules updated');toast('Calling rules saved')"><label>Calling window<select><option>09:00–18:00</option></select></label><label>Retry count<input value="3"></label><label>Cooldown<input value="24 hours"></label><label>Suppression<select><option>After successful contact</option></select></label><button class="btn primary">Save Rules</button></form></div><div class="card"><h3 class="section">Campaign</h3><div class="kv"><b>Planned</b><span>2,400</span><b>Completed</b><span>1,186</span><b>Contactability</b><span>90%</span></div></div></div>`)},
notifications(){layout("Notifications","Configure event channels.",`<div class="card"><table><thead><tr><th>Event</th><th>Voice</th><th>WhatsApp</th><th>SMS</th><th>Email</th></tr></thead><tbody>${[["Critical","✓","✓","✓","—"],["High","✓","✓","—","✓"],["Medium","✓","—","✓","—"],["Leadership escalation","✓","✓","✓","✓"]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)},
integrations(){layout("Integrations","Connected systems and service status.",`<div class="grid g3">${["Beneficiary Bulk Upload","WhatsApp Business API","SMS / Email","Voice / Telephony","Health Record Module","Reporting / MIS"].map(x=>`<div class="card"><h3 class="section">${x}</h3>${badge("OK")} <span style="font-size:10px">Connected / Ready</span><br><br><button class="btn" onclick="toast('${x} settings opened')">Configure</button></div>`).join("")}</div>`)},
audit(){layout("Audit Trail","Recorded platform actions and configuration changes.",`<div class="filters"><input placeholder="Search actor, case or event"></div><div class="card"><table><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Reference</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${a.time}</td><td>${a.actor}</td><td>${a.event}</td><td>${a.ref}</td></tr>`).join("")||"<tr><td colspan=4>No audit events yet.</td></tr>"}</tbody></table></div>`)},
security(){layout("Security & Compliance","Operational security and privacy controls.",`<div class="grid g3">${["Role-based access","Encryption","India data residency","Consent & privacy","Vulnerability testing","Backup & recovery"].map(x=>`<div class="card"><h3 class="section">${x}</h3>${badge("OK")} <span style="font-size:10px">Configured / monitored</span></div>`).join("")}</div>`)},
help(){layout("Help & Training","SOPs, user guides and operational support.",`<div class="grid g3">${["Getting Started","Case Management","AI Voice SOP","Referral SOP","Dashboard Guide","Security & Privacy"].map(x=>`<div class="card"><h3 class="section">${x}</h3><p style="font-size:10px;color:var(--muted)">Open the guide for step-by-step operational instructions.</p><button class="btn" onclick="toast('Guide opened')">Open Guide</button></div>`).join("")}</div>`)},
mobile(){layout("Mobile Experience","Field-ready view for urgent work.",`<div class="mobile"><div class="mhead"><b>HYI.AI · MNSI</b><span style="float:right">🔔</span><div style="font-size:10px">Shahdol District</div></div><div class="mcontent"><div class="card" style="box-shadow:none;background:#fff8f8"><b>6 Critical Cases</b><p style="font-size:10px;color:var(--muted)">Immediate attention required</p><button class="btn danger" onclick="page('cases')">Open Queue</button></div><h3 class="section" style="margin-top:15px">My Tasks</h3>${state.beneficiaries.slice(0,3).map(b=>`<div class="card" style="box-shadow:none;margin-bottom:8px"><b>${b.name}</b> ${badge(b.risk)}<p style="font-size:10px;color:var(--muted)">${b.id}</p><button class="btn" onclick="page('calls')">Call</button> <button class="btn" onclick="page('cases')">Case</button></div>`).join("")}</div><div class="mnav">⌂ Home　◉ Beneficiaries　⚠ Cases　⇢ Referrals</div></div>`)}
};
